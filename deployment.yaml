apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeploy
spec:
  replicas: 1
  selector:
    matchLabels:
      Dev: Ops
  template:
    metadata:
      name: mypod1
      labels:
        Dev: Ops
    spec:
      containers:
      - name: mycontainer
        image: sheenusk/srini:vasu   # replace with your Docker-image pushed on Dockerhub
        ports:
        - containerPort: 80
